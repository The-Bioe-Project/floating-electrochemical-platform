<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="900" fill="#ffffff"/>
  <!-- Common core -->
  <rect x="80" y="70" width="1440" height="300" rx="18" fill="#eef3f5" stroke="#1f4e5f" stroke-width="3"/>
  <text x="800" y="118" text-anchor="middle" font-size="34" font-weight="700" fill="#1f4e5f">COMMON CORE — floating electrochemical base</text>
  <g font-size="22" fill="#1f2d33">
    <rect x="120" y="150" width="320" height="180" rx="12" fill="#ffffff" stroke="#6a8a95" stroke-width="2"/>
    <text x="280" y="190" text-anchor="middle" font-weight="700">Floating body</text>
    <text x="280" y="225" text-anchor="middle">tubular polymer hull, ballast</text>
    <text x="280" y="255" text-anchor="middle">and floater keep it upright;</text>
    <text x="280" y="285" text-anchor="middle">gas chamber and collection</text>
    <text x="280" y="315" text-anchor="middle">valve at the top</text>

    <rect x="460" y="150" width="320" height="180" rx="12" fill="#ffffff" stroke="#6a8a95" stroke-width="2"/>
    <text x="620" y="190" text-anchor="middle" font-weight="700">Structural carbon electrode</text>
    <text x="620" y="225" text-anchor="middle">conductive carbon coating on</text>
    <text x="620" y="255" text-anchor="middle">the hull wall: the wall itself</text>
    <text x="620" y="285" text-anchor="middle">is the cathode — no separate</text>
    <text x="620" y="315" text-anchor="middle">electrode, no noble metal</text>

    <rect x="800" y="150" width="320" height="180" rx="12" fill="#ffffff" stroke="#6a8a95" stroke-width="2"/>
    <text x="960" y="190" text-anchor="middle" font-weight="700">Consumable metal cartridge</text>
    <text x="960" y="225" text-anchor="middle">active metal (e.g. Al, Mg, Zn)</text>
    <text x="960" y="255" text-anchor="middle">as sacrificial anode; replacing</text>
    <text x="960" y="285" text-anchor="middle">the cartridge is the only</text>
    <text x="960" y="315" text-anchor="middle">recharge operation</text>

    <rect x="1140" y="150" width="340" height="180" rx="12" fill="#ffffff" stroke="#6a8a95" stroke-width="2"/>
    <text x="1310" y="190" text-anchor="middle" font-weight="700">Buoyancy readout</text>
    <text x="1310" y="225" text-anchor="middle">accumulated gas lifts the body;</text>
    <text x="1310" y="255" text-anchor="middle">the emersed height, read on a</text>
    <text x="1310" y="285" text-anchor="middle">graduated scale, estimates the</text>
    <text x="1310" y="315" text-anchor="middle">gas volume — no sensor</text>
  </g>

  <!-- arrows down -->
  <g stroke="#1f4e5f" stroke-width="4" fill="#1f4e5f">
    <line x1="440" y1="370" x2="440" y2="440"/>
    <polygon points="425,435 455,435 440,465"/>
    <line x1="1160" y1="370" x2="1160" y2="440"/>
    <polygon points="1145,435 1175,435 1160,465"/>
  </g>
  <text x="440" y="425" text-anchor="middle" font-size="20" fill="#1f4e5f" font-style="italic" dx="-110">+ module</text>
  <text x="1160" y="425" text-anchor="middle" font-size="20" fill="#1f4e5f" font-style="italic" dx="-110">+ module</text>

  <!-- Configuration A -->
  <rect x="80" y="470" width="700" height="380" rx="18" fill="#e9f4ec" stroke="#2e7d4f" stroke-width="3"/>
  <text x="430" y="520" text-anchor="middle" font-size="32" font-weight="700" fill="#2e7d4f">CONFIGURATION A — Hydrogen</text>
  <rect x="130" y="550" width="600" height="80" rx="12" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="430" y="583" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d33">Module: galvanic–photovoltaic integration</text>
  <text x="430" y="613" text-anchor="middle" font-size="20" fill="#1f2d33">small PV panel in series with the galvanic pair</text>
  <g font-size="21" fill="#1f2d33">
    <text x="130" y="670">• spontaneous galvanic mode, day and night</text>
    <text x="130" y="705">• under sunlight the PV voltage adds to the cell voltage</text>
    <text x="130" y="740">  and intensifies gas evolution; reverts passively at night</text>
    <text x="130" y="775">• gas accumulates in the hull and is drawn off at the valve</text>
  </g>
  <rect x="130" y="795" width="600" height="40" rx="8" fill="#2e7d4f"/>
  <text x="430" y="823" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Product: collected hydrogen</text>

  <!-- Configuration B -->
  <rect x="820" y="470" width="700" height="380" rx="18" fill="#fdf3e7" stroke="#b5651d" stroke-width="3"/>
  <text x="1170" y="520" text-anchor="middle" font-size="32" font-weight="700" fill="#b5651d">CONFIGURATION B — Electrical power</text>
  <rect x="870" y="550" width="600" height="80" rx="12" fill="#ffffff" stroke="#b5651d" stroke-width="2"/>
  <text x="1170" y="583" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d33">Module: energy conditioner</text>
  <text x="1170" y="613" text-anchor="middle" font-size="20" fill="#1f2d33">harvests the low-voltage, high-impedance cell output</text>
  <g font-size="21" fill="#1f2d33">
    <text x="870" y="670">• collects charge slowly without collapsing the source</text>
    <text x="870" y="705">• raises tenths of a volt to the level needed by a small</text>
    <text x="870" y="740">  storage element and, downstream, by sensors and radio</text>
    <text x="870" y="775">• hydrogen is a by-product, still metered by buoyancy</text>
  </g>
  <rect x="870" y="795" width="600" height="40" rx="8" fill="#b5651d"/>
  <text x="1170" y="823" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Product: electrical power for on-board instrumentation</text>

  <text x="800" y="885" text-anchor="middle" font-size="19" fill="#555" font-style="italic">The structural and electrochemical core is identical in both configurations; only the coupled module changes.</text>
</svg>
